name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      - name: Test
        run: pytest tests/ -q

  pipeline:
    # Proves the data -> train -> export -> serve path still works end to end,
    # on a dataset small enough to finish in a couple of minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Train on a small dataset
        run: python -m cueai.ml.train --n-samples 400 --epochs 10

      - name: Benchmark
        run: python scripts/benchmark.py --repeats 50

      - name: Render figures
        run: python scripts/make_figures.py

      - uses: actions/upload-artifact@v4
        with:
          name: cueai-pipeline-output
          path: |
            models/metrics.json
            models/latency.json
            docs/BENCHMARKS.md
            docs/assets/*.png
