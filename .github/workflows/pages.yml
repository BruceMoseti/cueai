name: Deploy the playable table

# The game is dependency-free ES modules, so "building" it is copying web/.
# It still has to pass the physics parity check before it goes live: a page
# that plays differently from the reference simulator would undercut the point
# of publishing it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the reference simulator
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check the browser physics against the reference
        run: |
          python scripts/export_parity_cases.py --check
          node web/test/parity.mjs

      - name: Play the bot against itself
        run: node web/test/selfplay.mjs --games 4 --difficulty club

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publishing needs Pages switched on once, by hand, with Source set to
      # "GitHub Actions" in Settings -> Pages. It cannot be automated from here:
      # creating a Pages site needs administration:write, which a workflow token
      # cannot be granted, so configure-pages fails with "Resource not
      # accessible by integration" until the site exists. After that this step
      # just reads the existing configuration on every run.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
